[project]
name = "modelado-nosql"
version = "0.1.0"
description = ""
authors = [
    {name = "jhon.reyes",email = "jhon.reyes@basetis.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "duckdb (>=1.4.4,<2.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "ipython-sql (>=0.5.0,<0.6.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "neo4j (>=6.1.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "jupysql (>=0.11.1,<0.12.0)"
]
